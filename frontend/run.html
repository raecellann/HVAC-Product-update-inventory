<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="theme-color" content="#0a2d6e">
  <title>Run — HVAC Inventory</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar" id="app-shell"></header>

    <main class="app-main">
      <div class="wrap">
        <div class="page-header">
          <div>
            <h1 class="page-header__title" id="page-title">Run</h1>
            <p class="page-header__subtitle" id="page-sub"></p>
          </div>
          <div class="card__actions">
            <a class="btn" href="/history.html">All runs →</a>
          </div>
        </div>

        <div id="stepper-slot"></div>

        <!-- Result panel — success/failure/interrupted -->
        <div id="result-mount"></div>

        <!-- Job status while running -->
        <div id="job-status" class="hidden" aria-live="polite"></div>

        <div id="alerts"></div>

        <!-- Counts tiles (reused for cache_refresh as "Product list at a glance") -->
        <section class="card" id="summary-card" aria-labelledby="summary-title">
          <div class="card__header">
            <div>
              <h2 class="card__title" id="summary-title">Summary</h2>
              <p class="card__subtitle" id="summary-sub"></p>
            </div>
          </div>
          <div id="summary-tiles"></div>
        </section>

        <!-- Before/after table (hidden for cache_refresh and combined runs) -->
        <section class="card hidden" id="changes-card" aria-labelledby="changes-title">
          <div class="card__header">
            <div>
              <h2 class="card__title" id="changes-title">Before / after</h2>
              <p class="card__subtitle">The rows this run touched.</p>
            </div>
          </div>
          <div id="changes-mount"></div>
        </section>

        <section class="card hidden" id="problems-card" aria-labelledby="problems-title">
          <div class="card__header">
            <div>
              <h2 class="card__title" id="problems-title">Rows we couldn't use</h2>
              <p class="card__subtitle">These rows from your file weren't pushed to Shopify.</p>
            </div>
          </div>
          <div id="problems-mount"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/src/run.js"></script>
</body>
</html>
